name: build-release

# 触发条件：
#   - main 分支推送：编译 Windows / macOS 二进制（徽章状态与最新构建同步；不创建 Release）
#   - 推送 v* 标签（如 v1.0.0）：自动编译 Windows / macOS 二进制并创建 GitHub Release
#   - 手动触发（workflow_dispatch）：仅产出可下载的构建产物，不创建 Release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================= 并行构建 Windows 与 macOS 二进制 =================
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 一个平台失败不阻塞另一个平台
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: dsh-systray-windows-x64.zip
          - name: macos-universal
            os: macos-latest
            artifact: dsh-systray-macos-universal.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Wails CLI (pinned; v2.15.0 兼容 Go 1.27，v2.11.0 会报 "package fmt without types")
        shell: bash
        run: |
          WAILS_VER="v2.15.0"
          go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VER}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build binary (Wails v2)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev"
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows: 单文件 exe（WebView2 前端内嵌）；-webview2 download 嵌入运行时引导器兜底
            wails build -s -clean -platform windows/amd64 \
              -webview2 download \
              -ldflags "-s -w -H=windowsgui -X main.appVersion=${VERSION}"
            cp build/bin/dsh-systray.exe dist/
          else
            # macOS: Wails 直接产出 universal .app（Intel + Apple Silicon）；
            # build/darwin/Info.plist 已注入 LSUIElement=true（隐藏 Dock 图标，纯托盘应用）
            wails build -s -clean -platform darwin/universal \
              -ldflags "-s -w -X main.appVersion=${VERSION}"
            cp -R build/bin/dsh-systray.app dist/
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path dist/dsh-systray.exe -DestinationPath ${{ matrix.artifact }} -Force"
          else
            chmod +x "dist/dsh-systray.app/Contents/MacOS/dsh-systray"
            zip -r -y "${{ matrix.artifact }}" "dist/dsh-systray.app"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ============ 打标签后：汇总两个平台的产物并创建 GitHub Release ============
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main, for README size sync)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      # Release 正文来源：docs/RELEASE_NOTES.md 中「## vX.Y.Z」区块（发版前维护的相对上一版
      # 功能摘要：新增/变更/移除）。找不到对应区块时回退为 GitHub 自动生成（提交列表）。
      - name: Extract curated release notes
        id: notes
        shell: bash
        run: |
          python3 - "${GITHUB_REF_NAME}" <<'PY'
          import sys, pathlib
          tag = sys.argv[1]
          txt = pathlib.Path("docs/RELEASE_NOTES.md").read_text(encoding="utf-8")
          out, on = [], False
          for ln in txt.splitlines():
              if ln.startswith("## "):
                  if on:
                      break
                  on = (ln.strip() == "## " + tag)
              elif on:
                  out.append(ln)
          if out:
              pathlib.Path("release_body.md").write_text(
                  "\n".join(out).strip() + "\n", encoding="utf-8")
              print("curated notes found for " + tag)
          else:
              print("no curated notes for " + tag)
          PY
          if [ -s release_body.md ]; then echo "HAS_NOTES=1" >> "$GITHUB_OUTPUT"; else echo "HAS_NOTES=0" >> "$GITHUB_OUTPUT"; fi

      - name: Create GitHub Release (curated notes)
        if: steps.notes.outputs.HAS_NOTES == '1'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release_body.md

      - name: Create GitHub Release (auto notes fallback)
        if: steps.notes.outputs.HAS_NOTES != '1'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

      # 自动把 README 下载表的大小同步为本次 release 的真实产物大小
      - name: Sync README download sizes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          python3 - "$TAG" <<'PY'
          import sys, os, json, urllib.request, re
          tag = sys.argv[1]
          repo = os.environ["GITHUB_REPOSITORY"]
          with urllib.request.urlopen(
              "https://api.github.com/repos/%s/releases/tags/%s" % (repo, tag), timeout=20
          ) as r:
              data = json.load(r)
          sizes = {a["name"]: a["size"] for a in data.get("assets", [])}
          if "dsh-systray-windows-x64.zip" not in sizes or "dsh-systray-macos-universal.zip" not in sizes:
              print("missing assets; skip")
              sys.exit(0)
          def human(b):
              return "%.1f MB" % (b / (1024 * 1024))
          win = human(sizes["dsh-systray-windows-x64.zip"])
          mac = human(sizes["dsh-systray-macos-universal.zip"])
          txt = open("README.md", encoding="utf-8").read()
          n = re.sub(r"\| Windows \| x64 \| ZIP \| [0-9.]+ MB \|", "| Windows | x64 | ZIP | %s |" % win, txt)
          n = re.sub(r"\| macOS \| Intel \+ Apple Silicon \| ZIP \(\.app\) \| [0-9.]+ MB \|",
                     "| macOS | Intel + Apple Silicon | ZIP (.app) | %s |" % mac, n)
          open("README.md", "w", encoding="utf-8").write(n)
          print("windows=%s mac=%s" % (win, mac))
          PY
          git add README.md
          if ! git diff --cached --quiet; then
            git -c user.name="dsh-systray-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "docs: sync README download sizes to ${TAG}"
            git push origin HEAD:main
          else
            echo "README sizes already up to date"
          fi
