name: build-release

# 触发条件：
#   - 推送 v* 标签（如 v1.0.0）：自动编译 Windows / macOS 二进制并创建 GitHub Release
#   - 手动触发（workflow_dispatch）：仅产出可下载的构建产物，不创建 Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ================= 并行构建 Windows 与 macOS 二进制 =================
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # 一个平台失败不阻塞另一个平台
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            artifact: dsh-systray-windows-x64.zip
          - name: macos-universal
            os: macos-latest
            artifact: dsh-systray-macos-universal.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (version from go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Windows: systray 为纯 Go 实现（无需 cgo）；-H=windowsgui 隐藏控制台窗口
            go build -trimpath -ldflags '-s -w -H=windowsgui' -o dist/dsh-systray.exe .
          else
            # macOS: systray 依赖 Cocoa（cgo），必须在 macOS runner 上构建；
            # 同时编译 arm64 + amd64 并用 lipo 合并为 universal 通用二进制（Intel/Apple Silicon 均可运行）
            CGO_ENABLED=1 go build -trimpath -ldflags '-s -w' -o dist/dsh-systray-arm64 .
            CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags '-s -w' -o dist/dsh-systray-amd64 .
            lipo -create -output dist/dsh-systray dist/dsh-systray-arm64 dist/dsh-systray-amd64
            rm dist/dsh-systray-arm64 dist/dsh-systray-amd64
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            powershell -NoProfile -Command "Compress-Archive -Path dist/dsh-systray.exe -DestinationPath ${{ matrix.artifact }} -Force"
          else
            chmod +x dist/dsh-systray
            VERSION="${GITHUB_REF_NAME#v}"
            APP="dsh-systray.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp dist/dsh-systray "$APP/Contents/MacOS/dsh-systray"
            cat > "$APP/Contents/Info.plist" <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
	<key>CFBundleName</key><string>dsh-systray</string>
	<key>CFBundleDisplayName</key><string>dsh-systray</string>
	<key>CFBundleIdentifier</key><string>com.deepseek.dsh-systray</string>
	<key>CFBundlePackageType</key><string>APPL</string>
	<key>CFBundleIconFile</key><string>AppIcon</string>
	<key>CFBundleExecutable</key><string>dsh-systray</string>
	<key>CFBundleShortVersionString</key><string>${VERSION}</string>
	<key>CFBundleVersion</key><string>${VERSION}</string>
	<key>LSMinimumSystemVersion</key><string>11.0</string>
	<key>NSHighResolutionCapable</key><true/>
</dict>
</plist>
PLIST
            mkdir -p "$APP/Contents/Resources/AppIcon.iconset"
            for s in 16 32 128 256 512; do
              sips -z $s $s app-icon.png --out "$APP/Contents/Resources/AppIcon.iconset/icon_${s}x${s}.png" >/dev/null
              d=$((s*2))
              sips -z $d $d app-icon.png --out "$APP/Contents/Resources/AppIcon.iconset/icon_${s}x${s}@2x.png" >/dev/null
            done
            iconutil -c icns "$APP/Contents/Resources/AppIcon.iconset" -o "$APP/Contents/Resources/AppIcon.icns"
            rm -rf "$APP/Contents/Resources/AppIcon.iconset"
            zip -r "${{ matrix.artifact }}" "$APP"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # ============ 打标签后：汇总两个平台的产物并创建 GitHub Release ============
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
