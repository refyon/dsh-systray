name: Feature request
description: Suggest a capability or a change in behaviour
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first — a feature request that explains the underlying need
        is much easier to act on than one that prescribes an implementation.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does the app get in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like to happen. Note the trade-off you are accepting (extra dependency, more UI, slower startup).
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or settings you already tried.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this idea
          required: true
        - label: I understand this is a spare-time project and not every request can be implemented
          required: false
