<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="doc-title">dsh-systray</title>
<meta name="description" id="doc-desc" content="dsh-systray — DeepSeek Harness 桌面托盘（Windows / macOS）。">
<style>
:root{
  --bg:#f8fafc; --surface:#ffffff; --surface-2:#f1f5f9; --text:#0f172a; --muted:#64748b;
  --border:#e2e8f0; --primary:#2563eb; --primary-deep:#1d4ed8; --soft:#dbeafe;
  --rad:16px; --shadow:0 8px 24px rgba(15,23,42,.07); --font:'Noto Sans SC',-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei UI','PingFang SC',sans-serif;
  color-scheme:light;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#0b1220; --surface:#111a2e; --surface-2:#1a2540; --text:#e2e8f0; --muted:#94a3b8;
    --border:#293548; --primary:#3b82f6; --primary-deep:#60a5fa; --soft:#1e3a5f;
    --shadow:0 8px 24px rgba(2,6,23,.5);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{width:min(1120px,calc(100% - 48px));margin:0 auto}
.eyebrow{color:var(--primary);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem}

/* language switch */
.langsw{position:fixed;top:14px;right:18px;z-index:20;display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:3px;box-shadow:0 4px 14px rgba(16,24,40,.10)}
.langsw button{border:0;border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--muted);background:transparent;cursor:pointer;font-family:var(--font);line-height:1.4}
.langsw button:hover{color:var(--text)}
.langsw button.active{background:var(--primary);color:#fff}

/* hero */
.hero{padding:80px 0 40px;text-align:center}
.hero .logo{width:132px;height:132px;margin:0 auto 18px;display:block;filter:drop-shadow(0 14px 26px rgba(29,78,216,.28))}
.hero h1{font-size:clamp(2.4rem,6vw,3.6rem);font-weight:700;line-height:1.05;letter-spacing:-.03em;margin:0 0 14px}
.hero .sub{max-width:620px;margin:0 auto;color:var(--muted);font-size:1.12rem;line-height:1.6}
.actions{display:flex;gap:14px;justify-content:center;margin-top:30px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:13px 26px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn .ico{width:18px;height:18px}
.btn.primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(29,78,216,.28)}
.btn.primary:hover{background:var(--primary-deep)}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.btn.ghost:hover{border-color:#cfd4dd}
.ver-chip{margin-top:20px;font-size:13px;color:var(--muted)}
.ver-chip b{color:var(--primary)}

/* hub: centered carousel */
.hub{padding:52px 0 12px}
.car{position:relative;max-width:680px;margin:0 auto}
.shot-stack{position:relative}
.shot-stack .shot{width:100%;display:block;border-radius:16px;position:relative;z-index:2;box-shadow:0 18px 38px rgba(16,24,40,.10)}
.shot-stack::before,.shot-stack::after{content:"";position:absolute;left:0;right:0;height:100%;border-radius:16px;background:#fff;z-index:1}
.shot-stack::before{top:8px;left:-8px;box-shadow:0 10px 22px rgba(16,24,40,.07)}
.shot-stack::after{top:16px;left:-16px;box-shadow:0 12px 26px rgba(16,24,40,.06)}
/* carousel */
.car-stage .shot{transition:opacity .45s ease,transform .45s ease}
.car-stage .shot.fading{opacity:0;transform:scale(.982)}
.car-arrow{position:absolute;top:44%;transform:translateY(-50%);width:46px;height:46px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(16,24,40,.12);z-index:3;transition:border-color .15s,color .15s}
.car-arrow::before{content:"";display:block;width:11px;height:11px;border:0 solid currentColor;border-width:0 2px 2px 0;box-sizing:border-box}
.car-arrow.prev::before{transform:rotate(135deg)}
.car-arrow.next::before{transform:rotate(-45deg)}
.car-arrow:hover{border-color:var(--primary);color:var(--primary)}
.car-arrow.prev{left:14px}
.car-arrow.next{right:14px}
.car-bubble{position:absolute;left:24px;bottom:24px;z-index:3;background:rgba(16,24,40,.72);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;line-height:1.4;max-width:calc(100% - 48px);box-shadow:0 4px 14px rgba(16,24,40,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);pointer-events:none}
.car-dots{display:flex;gap:8px;justify-content:center;margin-top:20px}
.car-dot{width:8px;height:8px;border-radius:999px;background:#c9d0da;border:0;padding:0;cursor:pointer;transition:width .25s,background .25s}
.car-dot:hover{background:#9aa4b2}
.car-dot.active{width:22px;background:var(--primary)}

/* notes */
.notes{margin-top:66px;background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);box-shadow:var(--shadow);padding:34px 38px}
.notes h2{margin:0 0 18px;font-size:22px}
.notes ol{margin:0;padding-left:20px;line-height:1.7;color:var(--muted)}
.notes li{margin-bottom:4px}
.notes code{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-size:13px;color:var(--primary)}

/* footer */
footer{padding:56px 0 72px;text-align:center;color:var(--muted);font-size:14px}
footer a{color:var(--primary)}
footer .sep{margin:0 8px;color:var(--border)}

/* reveal */
[data-reveal]{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s}
[data-reveal].in{opacity:1;transform:none}
@media(max-width:600px){.hero{padding-top:64px}}
</style>
</head>
<body>
<div class="langsw" role="group" aria-label="Language / 语言">
  <button type="button" data-lang="zh" aria-pressed="false">中</button>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>
<main class="wrap">
  <section class="hero">
    <img class="logo" src="icon.svg" alt="dsh-systray 图标" width="132" height="132">
    <div class="eyebrow">Windows · macOS</div>
    <h1>dsh-systray</h1>
    <p class="sub" data-i18n="heroSub">DeepSeek Harness 桌面托盘：双击后台启动本地服务。</p>
    <div class="actions">
      <a class="btn primary" href="https://github.com/refyon/dsh-systray/releases/latest/download/dsh-systray-windows-x64.zip"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5l8.5-1.2v8.4H3V5.5zm9.5-1.3L21 3v9.7h-8.5V4.2zM3 13.7h8.5v8.4L3 20.9v-7.2zm9.5.8H21v6.9l-8.5 1.3v-8.2z"/></svg><span data-i18n="dlWin">下载 Windows 版</span></a>
      <a class="btn ghost" href="https://github.com/refyon/dsh-systray/releases/latest/download/dsh-systray-macos-universal.zip"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M16.9 12.9c0-2.1 1.7-3.1 1.8-3.2-1-1.4-2.5-1.6-3-1.7-1.3-.1-2.5.8-3.2.8-.6 0-1.6-.8-2.7-.7-1.4 0-2.7.8-3.4 2-1.4 2.5-.4 6.2 1 8.2.7 1 1.5 2.1 2.6 2 .9 0 1.3-.6 2.5-.6s1.5.6 2.5.6c1 0 1.7-1 2.4-2 .7-1.1 1-2.1 1-2.2 0 0-2-1-2-3.2zM15 6.3c.6-.7 1-1.7.9-2.7-.8 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6.9.1 1.9-.5 2.5-1.2z"/></svg><span data-i18n="dlMac">下载 macOS 版</span></a>
    </div>
    <div class="ver-chip"><span data-i18n="verLabel">当前版本</span> <b id="version">v0.8.13</b></div>
  </section>

  <section class="hub" id="screenshots">
    <div class="car" data-reveal>
      <div class="shot-stack car-stage">
        <img class="shot" id="car-img" src="shots/general.webp" alt="dsh-systray 界面" />
        <div class="car-bubble" id="car-cap">常规</div>
      </div>
      <button class="car-arrow prev" id="car-prev" type="button" aria-label="上一张"></button>
      <button class="car-arrow next" id="car-next" type="button" aria-label="下一张"></button>
      <div class="car-dots" id="car-dots"></div>
    </div>
  </section>

  <section class="notes" data-reveal>
    <h2 data-i18n="notesTitle">开始使用</h2>
    <ol>
      <li data-i18n="n1">下载对应平台 zip 并解压到任意目录</li>
      <li data-i18n="n2"><b>Windows</b>：双击 <code>dsh-systray.exe</code>（SmartScreen 提示时选「仍要运行」）</li>
      <li data-i18n="n3"><b>macOS</b>：首次<b>右键 → 打开</b> <code>dsh-systray</code></li>
      <li data-i18n="n4">首次启动约 2-5 分钟完成环境部署，随后自动打开服务</li>
    </ol>
  </section>
</main>

<footer>
  <p>
    <a href="https://github.com/refyon/dsh-systray/releases/latest" target="_blank" rel="noopener"><span data-i18n="fLinkRel">更新日志</span></a><span class="sep">·</span>
    <a href="https://github.com/refyon/dsh-systray/releases/latest/download/SHA256SUMS.txt" target="_blank" rel="noopener"><span data-i18n="fLinkSha">SHA256 校验和</span></a><span class="sep">·</span>
    <a href="https://github.com/refyon/dsh-systray" target="_blank" rel="noopener"><span data-i18n="fLinkSrc">源码 ↗</span></a>
  </p>
</footer>

<script>
(function(){
  // ==================== i18n（中/英） ====================
  var I18N = {
    zh: {
      title: "dsh-systray",
      desc: "dsh-systray — DeepSeek Harness 桌面托盘（Windows / macOS）。",
      logoAlt: "dsh-systray 图标",
      heroSub: "DeepSeek Harness 桌面托盘：双击后台启动本地服务。",
      dlWin: "下载 Windows 版", dlMac: "下载 macOS 版",
      verLabel: "当前版本",
      notesTitle: "开始使用",
      n1: "下载对应平台 zip 并解压到任意目录",
      n2: "<b>Windows</b>：双击 <code>dsh-systray.exe</code>（SmartScreen 提示时选「仍要运行」）",
      n3: "<b>macOS</b>：首次<b>右键 → 打开</b> <code>dsh-systray</code>",
      n4: "首次启动约 2-5 分钟完成环境部署，随后自动打开服务",
      fLinkRel: "更新日志", fLinkSha: "SHA256 校验和", fLinkSrc: "源码 ↗",
      prevAria: "上一张", nextAria: "下一张", dotAria: "第 %d 张",
      carCap: ["常规", "关于 · 版本与更新", "关于 · 已安装插件", "日志", "导出", "导入"]
    },
    en: {
      title: "dsh-systray",
      desc: "dsh-systray — a desktop tray app for DeepSeek Harness (Windows / macOS).",
      logoAlt: "dsh-systray logo",
      heroSub: "A desktop tray app for DeepSeek Harness: double-click to start the local service.",
      dlWin: "Download for Windows", dlMac: "Download for macOS",
      verLabel: "Version",
      notesTitle: "Getting Started",
      n1: "Download the zip for your platform and extract it anywhere",
      n2: "<b>Windows</b>: double-click <code>dsh-systray.exe</code> (choose “More info → Run anyway” if SmartScreen appears)",
      n3: "<b>macOS</b>: first time <b>right-click → Open</b> <code>dsh-systray</code>",
      n4: "First launch takes about 2–5 min to deploy the environment, then opens the service automatically",
      fLinkRel: "Release Notes", fLinkSha: "SHA256 checksums", fLinkSrc: "Source ↗",
      prevAria: "Previous", nextAria: "Next", dotAria: "Slide %d",
      carCap: ["General", "About · version & updates", "About · installed plugins", "Logs", "Export", "Import"]
    }
  };

  var LS_KEY = "dsh-lang";
  function detectLang() {
    try {
      var m = (location.search.match(/[?&]lang=(zh|en)/) || [])[1];
      if (m === "zh" || m === "en") return m;
    } catch (e) {}
    var saved = "";
    try { saved = localStorage.getItem(LS_KEY) || ""; } catch (e) {}
    if (saved === "zh" || saved === "en") return saved;
    var nav = String(navigator.language || navigator.userLanguage || "zh").toLowerCase();
    return nav.indexOf("zh") === 0 ? "zh" : "en";
  }
  var lang = detectLang();

  function applyLang(l) {
    lang = l;
    var d = I18N[lang];
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = d.title;
    var meta = document.getElementById("doc-desc");
    if (meta) meta.setAttribute("content", d.desc);
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n");
      if (d[k] !== undefined) el.innerHTML = d[k]; // notes 条目含 code/b 标签，统一 innerHTML
    });
    var logo = document.querySelector(".hero .logo");
    if (logo) logo.setAttribute("alt", d.logoAlt);
    // 切换按钮状态
    document.querySelectorAll(".langsw button").forEach(function (b) {
      var on = b.getAttribute("data-lang") === l;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    var prev = document.getElementById("car-prev"), next = document.getElementById("car-next");
    if (prev) prev.setAttribute("aria-label", d.prevAria);
    if (next) next.setAttribute("aria-label", d.nextAria);
    updateCarCaption();
    show(cur); // 语言切换后立即按新语言重选当前页图片（EN 图缺失自动回退 zh）
  }
  function toggleLang(l) {
    try { localStorage.setItem(LS_KEY, l); } catch (e) {}
    applyLang(l);
  }
  document.querySelectorAll(".langsw button").forEach(function (b) {
    b.addEventListener("click", function () { toggleLang(b.getAttribute("data-lang")); });
  });

  // ==================== 版本号 ====================
  var v = document.getElementById('version');
  fetch('https://api.github.com/repos/refyon/dsh-systray/releases/latest')
    .then(function(r){ return r.json(); })
    .then(function(d){ if(d && d.tag_name){ v.textContent = d.tag_name; } })
    .catch(function(){ /* 网络失败保持默认文案 */ });

  // ==================== 滚动显现 ====================
  var els = document.querySelectorAll('[data-reveal]');
  if('IntersectionObserver' in window && els.length){
    els.forEach(function(el,i){ el.style.transitionDelay = (i % 4) * 70 + 'ms'; });
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } });
    },{threshold:.15,rootMargin:'0px 0px -40px 0px'});
    els.forEach(function(el){ io.observe(el); });
  } else {
    els.forEach(function(el){ el.classList.add('in'); });
  }

  // ==================== 界面截图轮播 ====================
  // 图片为 WebP 且按需加载；EN 页优先使用 docs/shots-en/（英文 UI 截图），文件缺失时回退中文截图。
  var shots = [
    { en: 'shots-en/general.webp',     zh: 'shots/general.webp' },
    { en: 'shots-en/about-top.webp',   zh: 'shots/about-top.webp' },
    { en: 'shots-en/about-bottom.webp',zh: 'shots/about-bottom.webp' },
    { en: 'shots-en/logs.webp',        zh: 'shots/logs.webp' },
    { en: 'shots-en/export.webp',      zh: 'shots/export.webp' },
    { en: 'shots-en/import.webp',      zh: 'shots/import.webp' }
  ];
  var carImg = document.getElementById('car-img');
  var carCap = document.getElementById('car-cap');
  var carDots = document.getElementById('car-dots');
  var carBox = document.querySelector('.car');
  var cur = 0, seq = 0, playTimer = null;
  var loaded = {};   // 已加载完成的图片缓存（按真实 URL）
  var pending = {};  // 正在加载中的图片

  function curCaption() {
    return I18N[lang].carCap[cur] || I18N.zh.carCap[cur] || "";
  }
  function updateCarCaption() {
    carCap.textContent = curCaption();
    carImg.alt = curCaption();
    dotEls.forEach(function(dd, j){ dd.setAttribute('aria-label', I18N[lang].dotAria.replace('%d', j + 1)); });
  }

  // 候选列表按序尝试（EN 优先 → zh 兜底）。修复两处旧缺陷：
  // ① 首次加载完成/失败从未回调发起者（轮播要等第二圈才显示新图）；
  // ② 失败时每个排队回调各触发一次 fallback（重复请求回退图）。
  // 现在：每个请求者都会在加载完成时被回调；并发等待同一 src 共享一次加载。
  function pickShot(idx, cb) {
    var cands = lang === 'en' ? [shots[idx].en, shots[idx].zh] : [shots[idx].zh];
    (function next(k) {
      if (k >= cands.length) { cb(null); return; }
      var src = cands[k];
      if (loaded[src]) { cb(src); return; }
      var q = pending[src];
      if (!q) { q = pending[src] = []; loadOne(src, q); }
      q.push(function (s) { if (s) cb(s); else next(k + 1); });
    })(0);
  }
  function loadOne(src, q) {
    var im = new Image();
    im.onload = function () {
      loaded[src] = true;
      delete pending[src];
      var waiters = q.slice(); q.length = 0;
      waiters.forEach(function (f) { f(src); });
    };
    im.onerror = function () {
      loaded[src] = false;
      delete pending[src];
      var waiters = q.slice(); q.length = 0;
      waiters.forEach(function (f) { f(null); }); // 由各等待者自身触发下一候选（同源并发时共享一次 fallback 加载）
    };
    im.src = src;
  }
  function showShotSrc(src) {
    carImg.src = src;
    carImg.alt = curCaption();
  }

  var dotEls = shots.map(function(_, i){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'car-dot' + (i === 0 ? ' active' : '');
    b.setAttribute('aria-label', I18N[lang].dotAria.replace('%d', i + 1));
    b.addEventListener('click', function(){ show(i); play(); });
    carDots.appendChild(b);
    return b;
  });

  function show(i){
    cur = (i + shots.length) % shots.length;
    var my = ++seq;
    updateCarCaption();
    dotEls.forEach(function(d, j){ d.classList.toggle('active', j === cur); });
    // 语言优先：目标语言图已缓存直接显示；未缓存则按序加载（EN 图失败自动回退 zh）。
    // 注意不能以「任一语言已缓存」短路——zh 图缓存后切 EN 会永远显示中文图（旧缺陷）。
    var want = (lang === 'en') ? shots[cur].en : shots[cur].zh;
    if (loaded[want]) { showShotSrc(want); return; }
    pickShot(cur, function (src) {
      if (my !== seq || !src) return;
      carImg.src = src;
      carImg.alt = curCaption();
    });
  }
  function next(){ show(cur + 1); }
  function prev(){ show(cur - 1); }
  function play(){
    stop();
    playTimer = setInterval(next, 4500);
  }
  function stop(){
    if (playTimer){ clearInterval(playTimer); playTimer = null; }
  }

  document.getElementById('car-prev').addEventListener('click', function(){ prev(); play(); });
  document.getElementById('car-next').addEventListener('click', function(){ next(); play(); });
  carBox.addEventListener('mouseenter', stop);
  carBox.addEventListener('mouseleave', play);
  var touchX = 0;
  carBox.addEventListener('touchstart', function(e){ touchX = e.touches[0].clientX; stop(); }, { passive: true });
  carBox.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - touchX;
    if (dx > 42){ prev(); play(); }
    else if (dx < -42){ next(); play(); }
    else { play(); }
  }, { passive: true });

  // 首次进入即按检测到的语言渲染（随后启动轮播）
  applyLang(lang);
  play();
})();
</script>
</body>
</html>
